plugins {
    id 'fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:intermediary:${minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation files('libs/rinku-Jka5IbZi.jar')
    compileOnly files('libs/mixinextras-fabric-0.4.1.jar')
    include files('libs/rinku-Jka5IbZi.jar')
}

processResources {
    inputs.property 'version', project.version
    from(zipTree(layout.projectDirectory.file('resources/shoremod-assets.zip'))) {
        include 'assets/**'
    }

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
